<!DOCTYPE html>
<html>
  <head>
    <title>IPL Win Predictor</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 20px;
        background-color: #f8f9fa;
      }
      .prediction-form {
        background-color: #fff;
        padding: 20px;
        max-width: 500px;
        margin: auto;
        border-radius: 10px;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
      }
      .form-group {
        margin-bottom: 15px;
      }
      label {
        font-weight: bold;
      }
      input,
      select {
        width: 100%;
        padding: 8px;
        margin-top: 5px;
        border: 1px solid #ccc;
        border-radius: 4px;
      }
      .btn {
        background-color: #007bff;
        color: white;
        padding: 10px 20px;
        border: none;
        border-radius: 4px;
        cursor: pointer;
      }
      .btn:hover {
        background-color: #0056b3;
      }
    </style>
  </head>

  <body>
    <form
      action="{{ url_for('predict') }}"
      method="post"
      class="prediction-form"
    >
      <h2>IPL Match Win Predictor</h2>

      <div class="form-group">
        <label for="batting_team">Batting Team:</label>
        <select id="batting_team" name="batting_team" required>
          <option value="">-- Select Team --</option>
          <option value="Mumbai Indians">Mumbai Indians</option>
          <option value="Chennai Super Kings">Chennai Super Kings</option>
          <option value="Royal Challengers Bengaluru">
            Royal Challengers Bengaluru
          </option>
          <option value="Kolkata Knight Riders">Kolkata Knight Riders</option>
          <option value="Rajasthan Royals">Rajasthan Royals</option>
          <option value="Sunrisers Hyderabad">Sunrisers Hyderabad</option>
          <option value="Delhi Capitals">Delhi Capitals</option>
          <option value="Punjab Kings">Punjab Kings</option>
          <option value="Gujarat Titans">Gujarat Titans</option>
          <option value="Lucknow Super Giants">Lucknow Super Giants</option>
        </select>
      </div>

      <div class="form-group">
        <label for="bowling_team">Bowling Team:</label>
        <select id="bowling_team" name="bowling_team" required>
          <option value="">-- Select Team --</option>
          <option value="Mumbai Indians">Mumbai Indians</option>
          <option value="Chennai Super Kings">Chennai Super Kings</option>
          <option value="Royal Challengers Bengaluru">
            Royal Challengers Bengaluru
          </option>
          <option value="Kolkata Knight Riders">Kolkata Knight Riders</option>
          <option value="Rajasthan Royals">Rajasthan Royals</option>
          <option value="Sunrisers Hyderabad">Sunrisers Hyderabad</option>
          <option value="Delhi Capitals">Delhi Capitals</option>
          <option value="Punjab Kings">Punjab Kings</option>
          <option value="Gujarat Titans">Gujarat Titans</option>
          <option value="Lucknow Super Giants">Lucknow Super Giants</option>
        </select>
      </div>

      <div class="form-group">
        <label for="venue">Venue:</label>
        <select id="venue" name="venue" required>
          <option value="">-- Select Venue --</option>
          <option value="Mumbai">Mumbai</option>
          <option value="Chennai">Chennai</option>
          <option value="Kolkata">Kolkata</option>
          <option value="Bengaluru">Bengaluru</option>
          <option value="Ahmedabad">Ahmedabad</option>
          <option value="Delhi">Delhi</option>
          <option value="Hyderabad">Hyderabad</option>
          <option value="Jaipur">Jaipur</option>
          <option value="Mohali">Mohali</option>
          <option value="Dharamsala">Dharamsala</option>
          <option value="Lucknow">Lucknow</option>
        </select>
      </div>

      <div class="form-group">
        <label for="target">Target Score:</label>
        <input type="number" id="target" name="target" required />
      </div>

      <div class="form-group">
        <label for="current_score">Current Score:</label>
        <input type="number" id="current_score" name="current_score" required />
      </div>

      <div class="form-group">
        <label for="wickets">Wickets Lost:</label>
        <input
          type="number"
          id="wickets"
          name="wickets"
          required
          min="0"
          max="10"
        />
      </div>

      <div class="form-group">
        <label for="overs">Overs Completed:</label>
        <input
          type="number"
          id="overs"
          name="overs"
          required
          step="0.1"
          min="0"
          max="20"
        />
      </div>

      <button type="submit" class="btn">Predict Win Probability</button>
    </form>
  </body>
</html>
